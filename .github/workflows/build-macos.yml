name: Build macOS .dmg

# Runs on GitHub's macOS runners, so you never need a physical Mac to
# produce the .dmg -- PyInstaller + hdiutil can't cross-compile, but
# they work fine when the build itself happens on a real Mac in the cloud.
#
# Trigger it either way:
#   - Push a tag like "v1.0" to also attach the .dmg to a GitHub Release.
#   - Or run it manually from the repo's "Actions" tab (no tag needed) --
#     the .dmg is then downloadable from that run's "Artifacts" section.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .dmg
        run: python build.py

      - name: Upload .dmg as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleAIOverviewScraper-dmg
          path: dist/GoogleAIOverviewScraper.dmg

      - name: Attach .dmg to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GoogleAIOverviewScraper.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
