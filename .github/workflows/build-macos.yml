name: Build macOS .dmg

# Runs on GitHub's macOS runners, so you never need a physical Mac to
# produce the .dmg -- PyInstaller + hdiutil can't cross-compile, but
# they work fine when the build itself happens on a real Mac in the cloud.
#
# Trigger it either way:
#   - Push a tag like "v1.0" to also attach the .dmg to a GitHub Release.
#   - Or run it manually from the repo's "Actions" tab (no tag needed) --
#     the .dmg is then downloadable from that run's "Artifacts" section.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build-dmg:
    runs-on: macos-latest
    # The release-upload step below needs write access to this repo's
    # contents (to create/attach to a release). GitHub defaults new repos'
    # workflow token to read-only, so without this the step fails with a
    # 403 -- this grants write, scoped only to this one repo, only for the
    # lifetime of this job.
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .dmg
        run: python build.py

      - name: Upload .dmg as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleAIOverviewScraper-dmg
          path: dist/GoogleAIOverviewScraper.dmg

      - name: Attach .dmg to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        # Pinned to the exact commit the "v2" tag currently points to
        # (v2.6.2), rather than the floating "v2" tag, so this workflow
        # can't silently start running different/unexpected upstream code
        # later if that tag is ever moved.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/GoogleAIOverviewScraper.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
